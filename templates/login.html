<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Behavior Tracking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        :root {
            --bg-page: #F8F7F4;
            --bg-surface: #FFFFFF;
            --bg-elevated: #F1EFE9;
            --bg-header: #1C1917;
            --text-primary: #1C1917;
            --text-secondary: #78716C;
            --text-inverse: #FAFAF9;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-subtle: #EFF6FF;
            --border: #E7E5E0;
            --border-strong: #D6D3CD;
            --danger: #DC2626;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-heading: 'Instrument Sans', 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        link[rel="icon"] {
            image-rendering: auto;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-page);
            min-height: 100vh;
            color: var(--text-primary);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        
        .login-card h1 {
            font-family: var(--font-heading);
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
        }
        
        .login-card p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.375rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: var(--font-body);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 38px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.625rem 1.25rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.15s;
            min-height: 42px;
        }
        
        .login-btn:hover {
            background: var(--accent-hover);
        }
        
        .error-message {
            background: #FEF2F2;
            color: var(--danger);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.25rem;
            text-align: center;
            border: 1px solid #FECACA;
            font-size: 0.875rem;
        }
        
        .role-selector {
            display: flex;
            gap: 0.625rem;
            margin-bottom: 1.25rem;
        }
        
        .role-btn {
            flex: 1;
            padding: 0.625rem;
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
            font-family: var(--font-body);
            color: var(--text-primary);
        }
        
        .role-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }
        
        .info-text {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(28, 25, 23, 0.5);
            overflow: auto;
        }
        
        .modal-content {
            background: var(--bg-surface);
            margin: 5% auto;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .close {
            color: var(--text-secondary);
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: var(--font-body);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 38px;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
        }
        
        .register-btn {
            width: 100%;
            padding: 0.625rem 1.25rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.15s;
            min-height: 42px;
        }
        
        .register-btn:hover {
            background: var(--accent-hover);
        }
        
        .role-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.625rem;
            margin-bottom: 1.25rem;
        }
        
        .role-option {
            padding: 1rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--bg-surface);
        }
        
        .role-option:hover {
            border-color: var(--accent);
            background: var(--accent-subtle);
        }
        
        .role-option.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }
        
        .role-option h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1rem;
            font-family: var(--font-heading);
            font-weight: 600;
        }
        
        .role-option p {
            margin: 0;
            font-size: 0.75rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Behavior Tracking System logo" style="width: 48px; height: 48px; border-radius: 10px;">
                <div>
                    <h1>Behavior Tracking</h1>
                    <p>Please log in to continue</p>
                </div>
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="login-btn">Log In</button>
            </form>
            
            <p class="info-text">
                Staff: Full access to edit and manage data<br>
                Student: View-only access to personal data
            </p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    let errorMessage = 'Login failed. Please try again.';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        if (response.status === 429) {
                            errorMessage = 'Too many login attempts. Please wait a minute and try again.';
                        } else if (response.status === 500) {
                            errorMessage = 'Server error. Please try again later.';
                        } else {
                            errorMessage = `Login failed (${response.status}). Please try again.`;
                        }
                    }
                    errorDiv.textContent = errorMessage;
                    errorDiv.style.display = 'block';
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'Login failed. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Network error. Please check your connection and try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
